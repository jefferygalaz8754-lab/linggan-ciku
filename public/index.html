          if (appState.filterLang !== '全部' && s.language !== appState.filterLang) return false;
          if (appState.filterEmotion !== '全部' && s.emotion !== appState.filterEmotion) return false;
          if (appState.filterTechnique !== '全部' && s.technique !== appState.filterTechnique) return false;
          return true;
        });

        const visibleQuotes = (issue.quotes || []).filter((q) => {
          if (isQuoteBlocked(q)) return false;
          if (appState.filterEmotion !== '全部' && q.emotion !== appState.filterEmotion) return false;
          if (appState.filterTechnique !== '全部' && q.technique !== appState.filterTechnique) return false;
          return true;
        });

        const hasActiveFilter =
          appState.filterLang !== '全部' ||
          appState.filterEmotion !== '全部' ||
          appState.filterTechnique !== '全部';

        const songsHtml = visibleSongs.length === 0
          ? `<div class="empty-state" style="margin-top:12px;">当前筛选条件下暂无匹配歌词，试试重置筛选或查看其他期次。</div>`
          : visibleSongs.map((song) => {
              const liked = Boolean(appState.user.likedSongs[song.id]);
              const isForeign = song.language === '外文' && Array.isArray(song.translations) && song.translations.length > 0;
              const mode = appState.bilingualMode[song.id] || 'stacked';
              const hlSet = new Set((song.neigongMatch && song.neigongMatch.highlightLines) || []);

              let lyricHtml = '';
              if (isForeign && mode === 'interleaved') {
                lyricHtml = `<div class="lyric-block">` + song.lines.map((line, i) => `
                  <div class="bilingual-pair" data-note-song="${escapeHtml(song.id)}" data-note-line="${escapeHtml(line)}">
                    <div class="bilingual-orig">${escapeHtml(line)}</div>
                    <div class="bilingual-zh">${escapeHtml(song.translations[i] || '')}</div>
                  </div>
                `).join('') + `</div>`;
              } else {
                lyricHtml = `<div class="lyric-block">` + song.lines.map((line, i) => `
                  <span class="lyric-line ${hlSet.has(i) ? 'hl' : ''}" data-note-song="${escapeHtml(song.id)}" data-note-line="${escapeHtml(line)}" title="点击收藏单句到灵感本">
                    ${escapeHtml(line)}<span class="line-hint">+ 记灵感</span>
                  </span>
                `).join('') + `</div>`;

                if (isForeign) {
                  lyricHtml += `
                    <div class="translation-card">
                      <div class="translation-label">中文翻译</div>
                      <div class="translation-lines">${song.translations.map((t) => `<div>${escapeHtml(t)}</div>`).join('')}</div>
                    </div>
                  `;
                }
              }

              const bilingualToggleHtml = isForeign ? `
                <div class="bilingual-bar">
                  <span style="font-size:12px; color:var(--text-muted);">外文双语阅读模式</span>
                  <div class="mode-switch">
                    <button type="button" class="mode-btn ${mode === 'stacked' ? 'active' : ''}" data-bilingual="${escapeHtml(song.id)}" data-mode="stacked">分段对照</button>
                    <button type="button" class="mode-btn ${mode === 'interleaved' ? 'active' : ''}" data-bilingual="${escapeHtml(song.id)}" data-mode="interleaved">逐行双语</button>
                  </div>
                </div>
              ` : '';

              const neigongHtml = song.neigongMatch ? `
                <div class="neigong-banner">
                  <span>✦ ${escapeHtml(song.neigongMatch.note)}</span>
                  <button type="button" class="neigong-jump" data-open-neigong="${escapeHtml(issue.date)}">对照阅读本期内功 →</button>
                </div>
              ` : '';

              const dislikeMenuHtml = appState.openDislikeMenuId === song.id ? `
                <div class="dislike-menu">
                  <button type="button" class="dislike-option" data-dislike-type="creator" data-dislike-val="${escapeHtml(song.artist)}" data-dislike-label="歌手 ${escapeHtml(song.artist)}">
                    1. 不喜欢此人
                    <small>屏蔽 ${escapeHtml(song.artist)}，后续生成避开</small>
                  </button>
                  <button type="button" class="dislike-option" data-dislike-type="content" data-dislike-val="${escapeHtml(song.technique)}" data-dislike-label="技法「${escapeHtml(song.technique)}」">
                    2. 不喜欢此类内容
                    <small>屏蔽「${escapeHtml(song.technique)}」类写法</small>
                  </button>
                </div>
              ` : '';

              return `
                <article class="song-card" id="song-${escapeHtml(song.id)}">
                  <div class="song-aside">
                    <div class="song-num">${escapeHtml(song.index)}</div>
                    <div class="genre-vertical">${escapeHtml(song.genreVertical || '精选词作')}</div>
                    <span class="pill">${escapeHtml(song.language)}</span>
                  </div>
                  <div>
                    <div class="song-head">
                      <div class="song-title-line">
                        <h3 class="song-title">${escapeHtml(song.title)}</h3>
                        <span class="song-artist">${escapeHtml(song.artist)}</span>
                        ${song.lyricist ? `<span class="song-lyricist">词 / ${escapeHtml(song.lyricist)}</span>` : ''}
                      </div>
                      <div class="song-tags">
                        <span class="pill">${escapeHtml(song.emotion)}</span>
                        <span class="pill pill-gold">${escapeHtml(song.technique)}</span>
                        <span class="pill pill-ok" title="${escapeHtml(song.verification?.method || '原词已核验')}">✓ 已核验</span>
                      </div>
                    </div>
                    ${neigongHtml}
                     
                    ${bilingualToggleHtml}
                    ${lyricHtml}
                    <div class="reason-box">
                      <div class="reason-label">收录依据 · ${escapeHtml(song.category || '')}</div>
                      <p class="reason-text">${escapeHtml(song.reason)}</p>
                    </div>
                    <div class="action-row">
                      ${(audioSources(song).length || song.audio?.youtubeId) ? `<button type="button" class="act-btn ${appState.activePlayer?.songId === song.id && appState.activePlayer?.mode === 'full' ? 'playing' : ''}" data-play-full="${escapeHtml(song.id)}">${appState.activePlayer?.songId === song.id && appState.activePlayer?.mode === 'full' ? '■ 停止全曲' : '▶ 播放全曲'}</button>` : ''}
                      <button type="button" class="act-btn ${appState.activePlayer?.songId === song.id && appState.activePlayer?.mode === 'preview' ? 'playing' : ''}" data-play-preview="${escapeHtml(song.id)}">${appState.activePlayer?.songId === song.id && appState.activePlayer?.mode === 'preview' ? '■ 停止片段' : '♪ 30秒试听'}</button>
                      ${song.verification?.sourceUrl ? `<a class="act-btn" href="${escapeHtml(song.verification.sourceUrl)}" target="_blank" rel="noopener noreferrer">资料来源 ↗</a>` : ''}
                      ${officialLyricsUrl(song) ? `<a class="act-btn" href="${escapeHtml(officialLyricsUrl(song))}" target="_blank" rel="noopener noreferrer">完整歌词 ↗</a>` : ''}
                      <button type="button" class="act-btn" data-copy-song="${escapeHtml(song.id)}">复制摘录</button>
                      <button type="button" class="act-btn ${liked ? 'liked' : ''}" data-like-song="${escapeHtml(song.id)}">${liked ? '♥ 已点赞' : '♡ 点赞'}</button>
                      <div class="dislike-wrap">
                        <button type="button" class="act-btn" data-toggle-dislike="${escapeHtml(song.id)}"><svg class="broken-heart" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21C8 17.5 3 14 3 8.5A5 5 0 0 1 12 5a5 5 0 0 1 9 3.5C21 14 16 17.5 12 21Z"/><path d="m13 4-3 6 4 3-3 5"/></svg> 差评</button>
                        ${dislikeMenuHtml}
                      </div>
                    </div>
                  </div>
                </article>
              `;
            }).join('');

        const quotesHtml = visibleQuotes.length === 0
          ? `<div class="empty-state">当前筛选条件下暂无匹配金句。</div>`
          : `<div class="quotes-grid">` + visibleQuotes.map((q) => {
              const liked = Boolean(appState.user.likedQuotes[q.id]);
              const author = (q.source || '').split('·')[0].trim() || '该作者';
              const dislikeMenuHtml = appState.openDislikeMenuId === q.id ? `
                <div class="dislike-menu" style="right:0; left:auto;">
                  <button type="button" class="dislike-option" data-dislike-type="creator" data-dislike-val="${escapeHtml(author)}" data-dislike-label="作者 ${escapeHtml(author)}">
                    1. 不喜欢此人
                    <small>屏蔽 ${escapeHtml(author)}</small>
                  </button>
                  <button type="button" class="dislike-option" data-dislike-type="content" data-dislike-val="${escapeHtml(q.technique)}" data-dislike-label="技法「${escapeHtml(q.technique)}」">
                    2. 不喜欢此类内容
                    <small>屏蔽「${escapeHtml(q.technique)}」类金句</small>
                  </button>
                </div>
              ` : '';

              return `
                <article class="quote-card" id="quote-${escapeHtml(q.id)}">
                  <div>
                    <div class="quote-top">
                      <span class="quote-num">${escapeHtml(q.index)}</span>
                      <span class="pill">${escapeHtml(q.category)}</span>
                    </div>
                    <p class="quote-text" style="margin-top:12px;">${escapeHtml(q.text)}</p>
                  </div>
                  <div>
                    <div class="quote-tags" style="margin-bottom:10px;">
                      <span class="mini-tag">${escapeHtml(q.emotion)}</span>
                      <span class="mini-tag" style="color:var(--accent-gold); border-color:var(--accent-gold-border);">${escapeHtml(q.technique)}</span>
                    </div>
                    <div class="quote-foot">
                      <span class="quote-source">${escapeHtml(q.source)}</span>
                      <div class="quote-actions">
                        <button type="button" class="icon-btn" data-copy-quote="${escapeHtml(q.id)}">复制</button>
                        <button type="button" class="icon-btn ${liked ? 'liked' : ''}" data-like-quote="${escapeHtml(q.id)}">${liked ? '♥' : '♡'}</button>
                        <div class="dislike-wrap">
                          <button type="button" class="icon-btn" aria-label="差评" title="差评" data-toggle-dislike="${escapeHtml(q.id)}"><svg class="broken-heart" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21C8 17.5 3 14 3 8.5A5 5 0 0 1 12 5a5 5 0 0 1 9 3.5C21 14 16 17.5 12 21Z"/><path d="m13 4-3 6 4 3-3 5"/></svg></button>
                          ${dislikeMenuHtml}
                        </div>
                      </div>
                    </div>
                  </div>
                </article>
              `;
            }).join('') + `</div>`;

        root.innerHTML = `
          <section class="issue-bar">
            <div>
              <div class="issue-meta-top">
                <span class="pill ${isLatest ? 'pill-gold' : ''}">${isLatest ? '最新一期' : '过往期次'}</span>
                ${issue.neigong ? `<button type="button" class="pill pill-gold" style="cursor:pointer;" data-open-neigong="${escapeHtml(issue.date)}">今日内功 · ${escapeHtml(issue.neigong.coreTechnique)} →</button>` : ''}
              </div>
              <h1 class="issue-date">${escapeHtml(issue.displayDate)}</h1>
              <p class="issue-sub">每日早 8 点更新 · 过往期次可回看 · ${escapeHtml(issue.summary || '')}</p>
            </div>
            <div class="issue-controls">
              <button type="button" class="btn-outline" id="prevIssueBtn" ${hasPrev ? '' : 'disabled'}>← 前一期</button>
              <select class="date-select" id="issueSelect" aria-label="选择期次日期">
                ${appState.dates.map((d) => `<option value="${escapeHtml(d)}" ${d === appState.currentDate ? 'selected' : ''}>${escapeHtml(appState.issuesByDate[d].displayDate)}</option>`).join('')}
              </select>
              <button type="button" class="btn-outline" id="nextIssueBtn" ${hasNext ? '' : 'disabled'}>后一期 →</button>
              ${!isLatest ? `<button type="button" class="btn-outline btn-gold" id="backLatestBtn">回到最新</button>` : ''}
              <button type="button" class="btn-outline" id="openSyncBtn">导入 / 同步</button>
            </div>
          </section>

          <section class="filter-bar" aria-label="双维度作词筛选">
            <div class="filter-group">
              <span style="font-size:12px; color:var(--text-muted);">筛选：</span>
              ${['全部', '中文', '外文'].map((lang) => `<button type="button" class="filter-chip ${appState.filterLang === lang ? 'active' : ''}" data-filter-lang="${lang}">${lang}</button>`).join('')}
              <select class="filter-select" id="emotionFilter" aria-label="按情绪底色筛选">
                <option value="全部">全部情绪底色</option>
                ${Array.from(emotionSet).map((e) => `<option value="${escapeHtml(e)}" ${appState.filterEmotion === e ? 'selected' : ''}>情绪 · ${escapeHtml(e)}</option>`).join('')}
              </select>
              <select class="filter-select" id="techFilter" aria-label="按修辞技法筛选">
                <option value="全部">全部修辞技法</option>
                ${Array.from(techSet).map((t) => `<option value="${escapeHtml(t)}" ${appState.filterTechnique === t ? 'selected' : ''}>技法 · ${escapeHtml(t)}</option>`).join('')}
              </select>
            </div>
            <div class="filter-group">
              <span style="font-size:12px; color:var(--text-muted);">显示 ${visibleSongs.length} 首歌 · ${visibleQuotes.length} 条金句</span>
              ${hasActiveFilter ? `<button type="button" class="filter-chip active" id="resetFilterBtn">重置筛选</button>` : ''}
            </div>
          </section>

          <section id="songs">
            <div class="section-head">
              <h2 class="section-title">十首歌词摘录</h2>
              <span class="section-sub">7 首中文 · 3 首外文 · 附中译 · 点击任意一句可写入单句灵感本</span>
            </div>
            <div class="song-list">${songsHtml}</div>
          </section>

          <section id="quotes" class="quotes-section">
            <div class="section-head">
              <h2 class="section-title">金句粮草库</h2>
              <span class="section-sub">${(issue.quotes || []).length} 条 · 文学为主，兼收随笔、访谈与影视 · 单条不超过 200 字</span>
            </div>
            ${quotesHtml}
          </section>
        `;

        // Floating index rail
        rail.innerHTML = visibleSongs.map((s) => `<button type="button" class="rail-btn" data-jump="song-${escapeHtml(s.id)}">${escapeHtml(s.index)}</button>`).join('') +
          `<button type="button" class="rail-btn" data-jump="quotes" style="border-top:1px solid var(--hairline); margin-top:4px; padding-top:6px;">金句</button>`;

        rail.querySelectorAll('[data-jump]').forEach((b) => {
          b.addEventListener('click', () => {
            const target = document.getElementById(b.getAttribute('data-jump'));
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });

        bindHomeEvents(issue);
      }

      function bindHomeEvents(issue) {
        const prevBtn = document.getElementById('prevIssueBtn');
        const nextBtn = document.getElementById('nextIssueBtn');
        const sel = document.getElementById('issueSelect');
        const backLatest = document.getElementById('backLatestBtn');
        const openSync = document.getElementById('openSyncBtn');

        if (prevBtn) prevBtn.addEventListener('click', () => {
          const i = appState.dates.indexOf(appState.currentDate);
          if (i < appState.dates.length - 1) switchIssue(appState.dates[i + 1]);
        });
        if (nextBtn) nextBtn.addEventListener('click', () => {
          const i = appState.dates.indexOf(appState.currentDate);
          if (i > 0) switchIssue(appState.dates[i - 1]);
        });
        if (sel) sel.addEventListener('change', (e) => switchIssue(e.target.value));
        if (backLatest) backLatest.addEventListener('click', () => switchIssue(appState.dates[0]));
        if (openSync) openSync.addEventListener('click', openSyncModal);

        document.querySelectorAll('[data-filter-lang]').forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.filterLang = btn.getAttribute('data-filter-lang');
            renderHome();
          });
        });
        const emoSel = document.getElementById('emotionFilter');
        const techSel = document.getElementById('techFilter');
        const resetBtn = document.getElementById('resetFilterBtn');
        if (emoSel) emoSel.addEventListener('change', (e) => { appState.filterEmotion = e.target.value; renderHome(); });
        if (techSel) techSel.addEventListener('change', (e) => { appState.filterTechnique = e.target.value; renderHome(); });
        if (resetBtn) resetBtn.addEventListener('click', () => {
          appState.filterLang = '全部';
          appState.filterEmotion = '全部';
          appState.filterTechnique = '全部';
          renderHome();
        });

        document.querySelectorAll('[data-bilingual]').forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.bilingualMode[btn.getAttribute('data-bilingual')] = btn.getAttribute('data-mode');
            renderHome();
          });
        });

        document.querySelectorAll('[data-open-neigong]').forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.route = 'neigong-detail';
            appState.neigongDate = btn.getAttribute('data-open-neigong');
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        document.querySelectorAll('[data-note-song]').forEach((el) => {
          el.addEventListener('click', () => {
            const sid = el.getAttribute('data-note-song');
            const line = el.getAttribute('data-note-line');
            const song = (issue.songs || []).find((s) => s.id === sid);
            if (song) openNoteModal(line, song, issue.date);
          });
        });

        document.querySelectorAll('[data-play-full]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const song = (issue.songs || []).find((s) => s.id === btn.getAttribute('data-play-full'));
            if (song) startSongPlayback(song, 'full');
          });
        });

        document.querySelectorAll('[data-play-preview]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const song = (issue.songs || []).find((s) => s.id === btn.getAttribute('data-play-preview'));
            if (song) startSongPlayback(song, 'preview');
          });
        });

        document.querySelectorAll('[data-close-player]').forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.activePlayer = null;
            renderGlobalPlayer();
          });
        });

        document.querySelectorAll('[data-copy-song]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const song = (issue.songs || []).find((s) => s.id === btn.getAttribute('data-copy-song'));
            if (!song) return;
            const body = song.lines.join('\n') + (song.translations?.length ? '\n\n【中文翻译】\n' + song.translations.join('\n') : '');
            copyText(`《${song.title}》— ${song.artist}\n\n${body}`, `已复制《${song.title}》摘录`);
          });
        });

        document.querySelectorAll('[data-like-song]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const song = (issue.songs || []).find((s) => s.id === btn.getAttribute('data-like-song'));
            if (song) toggleLikeSong(song, issue.date);
          });
        });

        document.querySelectorAll('[data-copy-quote]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const q = (issue.quotes || []).find((item) => item.id === btn.getAttribute('data-copy-quote'));
            if (q) copyText(`${q.text}\n—— ${q.source}`, '已复制金句');
          });
        });

        document.querySelectorAll('[data-like-quote]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const q = (issue.quotes || []).find((item) => item.id === btn.getAttribute('data-like-quote'));
            if (q) toggleLikeQuote(q, issue.date);
          });
        });

        document.querySelectorAll('[data-toggle-dislike]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-toggle-dislike');
            appState.openDislikeMenuId = appState.openDislikeMenuId === id ? null : id;
            renderHome();
          });
        });

        document.querySelectorAll('[data-dislike-type]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            addDislike(
              btn.getAttribute('data-dislike-type'),
              btn.getAttribute('data-dislike-val'),
              btn.getAttribute('data-dislike-label')
            );
          });
        });
      }

      function renderLikes() {
        const root = document.getElementById('appRoot');
        document.getElementById('indexRail').innerHTML = '';

        const songs = Object.values(appState.user.likedSongs);
        const quotes = Object.values(appState.user.likedQuotes);
        const notes = appState.user.notes;
        const dislikes = appState.user.dislikes;

        let contentHtml = '';
        if (appState.likesTab === 'songs') {
          if (songs.length === 0) {
            contentHtml = `<div class="empty-state">还没有点赞任何歌词。回到今日词库，看到喜欢的就点一颗心吧。<div style="margin-top:16px;"><button type="button" class="btn-outline btn-gold" data-back-home>回到今日词库</button></div></div>`;
          } else {
            contentHtml = songs.map((s) => `
              <div class="neigong-card" style="cursor:default; margin-bottom:14px;">
                <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                  <div>
                    <strong style="font-family:var(--font-serif); font-size:19px;">《${escapeHtml(s.title)}》</strong>
                    <span style="color:var(--text-secondary); margin-left:8px;">${escapeHtml(s.artist)}</span>
                    <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">${escapeHtml(s.issueDate || '')}</span>
                  </div>
                  <div style="display:flex; gap:6px; align-items:center;">
                    <span class="pill">${escapeHtml(s.emotion)}</span>
                    <span class="pill pill-gold">${escapeHtml(s.technique)}</span>
                    ${(audioSources(s).length || s.audio?.youtubeId) ? `<button type="button" class="icon-btn" data-likes-play-full="${escapeHtml(s.id)}">▶ 播放全曲</button>` : ''}${officialLyricsUrl(s) ? `<a class="icon-btn" href="${escapeHtml(officialLyricsUrl(s))}" target="_blank" rel="noopener noreferrer">完整歌词 ↗</a>` : ''}<button type="button" class="icon-btn" data-likes-play-preview="${escapeHtml(s.id)}">♪ 试听</button><button type="button" class="icon-btn" data-unlike-song="${escapeHtml(s.id)}">移除</button>
                  </div>
                </div>
                <div style="font-family:var(--font-serif); font-size:15.5px; line-height:1.85; color:var(--text-secondary);">
                   ${(s.lines || []).map((l) => `<div>${escapeHtml(l)}</div>`).join('')}
                </div>
              </div>
            `).join('');
          }
        } else if (appState.likesTab === 'quotes') {
          if (quotes.length === 0) {
            contentHtml = `<div class="empty-state">还没有点赞任何金句。<div style="margin-top:16px;"><button type="button" class="btn-outline btn-gold" data-back-home>回到今日词库</button></div></div>`;
          } else {
            contentHtml = `<div class="quotes-grid">` + quotes.map((q) => `
              <div class="quote-card">
                <p class="quote-text">${escapeHtml(q.text)}</p>
                <div class="quote-foot">
                  <span class="quote-source">${escapeHtml(q.source)}</span>
                  <button type="button" class="icon-btn" data-unlike-quote="${escapeHtml(q.id)}">移除</button>
                </div>
              </div>
            `).join('') + `</div>`;
          }
        } else if (appState.likesTab === 'notes') {
          if (notes.length === 0) {
            contentHtml = `<div class="empty-state">单句灵感本还是空的。在今日词库中点击任意一行歌词，即可收藏单句并写下作词批注。<div style="margin-top:16px;"><button type="button" class="btn-outline btn-gold" data-back-home>去词库划句</button></div></div>`;
          } else {
            contentHtml = notes.map((n) => `
              <div class="neigong-card" style="cursor:default; margin-bottom:14px;">
                <div style="font-family:var(--font-serif); font-size:18px; border-left:2px solid var(--accent-gold); padding-left:12px; margin-bottom:10px;">
                  ${escapeHtml(n.line)}
                </div>
                ${n.note ? `<p style="font-size:14px; color:var(--text-secondary); margin:0 0 10px;">批注：${escapeHtml(n.note)}</p>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted);">
                  <div>
                    <span>出自 ${escapeHtml(n.artist)}《${escapeHtml(n.songTitle)}》（${escapeHtml(n.date)}）</span>
                    ${n.tag ? `<span class="pill pill-gold" style="margin-left:8px;">${escapeHtml(n.tag)}</span>` : ''}
                  </div>
                  <div style="display:flex; gap:8px;">
                    <button type="button" class="icon-btn" data-copy-note="${escapeHtml(n.id)}">复制</button>
                    <button type="button" class="icon-btn" data-del-note="${escapeHtml(n.id)}">删除</button>
                  </div>
                </div>
              </div>
            `).join('');
          }
        } else {
          if (dislikes.length === 0) {
            contentHtml = `<div class="empty-state">当前没有屏蔽任何歌手、作者或技法标签。</div>`;
          } else {
            contentHtml = dislikes.map((d) => `
              <div class="neigong-card" style="cursor:default; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
                <div>
                  <span class="pill" style="margin-right:8px;">${d.type === 'creator' ? '屏蔽创作者' : '屏蔽内容技法'}</span>
                  <strong>${escapeHtml(d.label)}</strong>
                </div>
                <button type="button" class="btn-outline" data-remove-dislike="${escapeHtml(d.id)}">撤销屏蔽</button>
              </div>
            `).join('');
          }
        }

        root.innerHTML = `
          <section class="subpage-head">
            <div>
              <h1 class="issue-date">我的点赞与灵感本</h1>
              <p class="issue-sub">你赞过的歌词、金句与单句批注都会收在这里；配置 D1 云端同步后，次日早 8 点生成最多一半席位偏向你的口味。</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn-outline btn-gold" id="exportMdBtn">导出 Markdown</button>
              <button type="button" class="btn-outline" id="openSyncFromLikesBtn">D1 云端同步设置</button>
            </div>
          </section>

          <div class="tabs-bar">
            <button type="button" class="tab-btn ${appState.likesTab === 'songs' ? 'active' : ''}" data-likes-tab="songs">点赞歌词 (${songs.length})</button>
            <button type="button" class="tab-btn ${appState.likesTab === 'quotes' ? 'active' : ''}" data-likes-tab="quotes">点赞金句 (${quotes.length})</button>
            <button type="button" class="tab-btn ${appState.likesTab === 'notes' ? 'active' : ''}" data-likes-tab="notes">单句灵感本 (${notes.length})</button>
            <button type="button" class="tab-btn ${appState.likesTab === 'dislikes' ? 'active' : ''}" data-likes-tab="dislikes">屏蔽管理 (${dislikes.length})</button>
          </div>

          <div>${contentHtml}</div>
        `;

        document.getElementById('exportMdBtn').addEventListener('click', exportLikesMarkdown);
        document.getElementById('openSyncFromLikesBtn').addEventListener('click', openSyncModal);
        root.querySelectorAll('[data-likes-tab]').forEach((b) => {
          b.addEventListener('click', () => {
            appState.likesTab = b.getAttribute('data-likes-tab');
            renderLikes();
          });
        });
        root.querySelectorAll('[data-back-home]').forEach((b) => {
          b.addEventListener('click', () => { appState.route = 'home'; renderAll(); });
        });
        root.querySelectorAll('[data-likes-play-full]').forEach((b) => {
          b.addEventListener('click', () => {
            const s = appState.user.likedSongs[b.getAttribute('data-likes-play-full')];
            if (s) startSongPlayback(s, 'full');
          });
        });
        root.querySelectorAll('[data-likes-play-preview]').forEach((b) => {
          b.addEventListener('click', () => {
            const s = appState.user.likedSongs[b.getAttribute('data-likes-play-preview')];
            if (s) startSongPlayback(s, 'preview');
          });
        });
        root.querySelectorAll('[data-play-full]').forEach((b) => {
          b.addEventListener('click', () => {
            const s = appState.user.likedSongs[b.getAttribute('data-play-full')];
            if (s) startSongPlayback(s, 'full');
          });
        });
        root.querySelectorAll('[data-play-preview]').forEach((b) => {
          b.addEventListener('click', () => {
            const s = appState.user.likedSongs[b.getAttribute('data-play-preview')];
            if (s) startSongPlayback(s, 'preview');
          });
        });
        root.querySelectorAll('[data-close-player]').forEach((b) => {
          b.addEventListener('click', () => { appState.activePlayer = null; renderAll(); });
        });
        root.querySelectorAll('[data-unlike-song]').forEach((b) => {
          b.addEventListener('click', () => {
            delete appState.user.likedSongs[b.getAttribute('data-unlike-song')];
            persistUserState(true);
            renderAll();
          });
        });
        root.querySelectorAll('[data-unlike-quote]').forEach((b) => {
          b.addEventListener('click', () => {
            delete appState.user.likedQuotes[b.getAttribute('data-unlike-quote')];
            persistUserState(true);
            renderAll();
          });
        });
        root.querySelectorAll('[data-copy-note]').forEach((b) => {
          b.addEventListener('click', () => {
            const n = appState.user.notes.find((x) => x.id === b.getAttribute('data-copy-note'));
            if (n) copyText(`${n.line}\n—— ${n.artist}《${n.songTitle}》${n.note ? '\n批注：' + n.note : ''}`, '已复制单句灵感');
          });
        });
        root.querySelectorAll('[data-del-note]').forEach((b) => {
          b.addEventListener('click', () => {
            appState.user.notes = appState.user.notes.filter((x) => x.id !== b.getAttribute('data-del-note'));
            persistUserState(true);
            renderAll();
          });
        });
        root.querySelectorAll('[data-remove-dislike]').forEach((b) => {
          b.addEventListener('click', () => {
            appState.user.dislikes = appState.user.dislikes.filter((x) => x.id !== b.getAttribute('data-remove-dislike'));
            persistUserState(true);
            renderAll();
            showToast('已撤销屏蔽');
          });
        });
      }

      function renderNeigongList() {
        const root = document.getElementById('appRoot');
        document.getElementById('indexRail').innerHTML = '';

        const articles = appState.dates
          .map((d) => appState.issuesByDate[d]?.neigong)
          .filter(Boolean).concat(ARCHIVED_ARTICLES).sort((a,b)=>b.date.localeCompare(a.date));

        root.innerHTML = `
          <section class="subpage-head">
            <div>
              <h1 class="issue-date">内功</h1>
              <p class="issue-sub">作词方法论每日一篇 · 与当期示范歌词联动 · 点击标题阅读全文</p>
            </div>
          </section>
          <div class="neigong-list">
            ${articles.map((art) => `
              <button type="button" class="neigong-card" data-open-art="${escapeHtml(art.id || art.date)}">
                <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
                  <span style="font-size:13px; color:var(--accent-gold); font-family:var(--font-serif);">${escapeHtml(art.date)}</span>
                  <span class="pill pill-gold">${escapeHtml(art.coreTechnique)}</span>
                  ${(art.secondaryTechniques || []).map((t) => `<span class="pill">${escapeHtml(t)}</span>`).join('')}
                </div>
                <div style="font-family:var(--font-serif); font-size:21px; font-weight:600; margin-bottom:8px;">${escapeHtml(art.title)}</div>
                <p style="font-size:14px; color:var(--text-secondary); margin:0;">${escapeHtml(art.excerpt)}</p>
              </button>
            `).join('')}
          </div>
        `;

        root.querySelectorAll('[data-open-art]').forEach((b) => {
          b.addEventListener('click', () => {
            appState.route = 'neigong-detail';
            appState.neigongDate = b.getAttribute('data-open-art');
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }

      function renderNeigongDetail() {
        const root = document.getElementById('appRoot');
        document.getElementById('indexRail').innerHTML = '';

        const issue = appState.issuesByDate[appState.neigongDate] || appState.issuesByDate[appState.dates[0]];
        const archive = ARCHIVED_ARTICLES.find(art=>art.id===appState.neigongDate);
        const art = archive || issue?.neigong;
        if (!art) {
          renderNeigongList();
          return;
        }

        const linkedSongs = (archive ? [] : issue.songs || []).filter((s) => (art.linkedSongIds || []).includes(s.id));

        root.innerHTML = `
          <article class="neigong-article">
            <button type="button" class="btn-outline" id="backNeigongListBtn">← 返回内功文章列表</button>
            <div style="display:flex; align-items:center; gap:10px; margin-top:22px; flex-wrap:wrap;">
              <span style="font-size:13.5px; color:var(--accent-gold);">${escapeHtml(art.date)}</span>
              <span class="pill pill-gold">${escapeHtml(art.coreTechnique)}</span>
              ${(art.secondaryTechniques || []).map((t) => `<span class="pill">${escapeHtml(t)}</span>`).join('')}
            </div>
            <h1>${escapeHtml(art.title)}</h1>
            <p style="font-size:15px; color:var(--text-secondary); line-height:1.85;">${escapeHtml(art.excerpt)}</p>

            ${art.sourceUrl ? `<p><a href="${escapeHtml(art.sourceUrl)}" target="_blank" rel="noopener noreferrer">原站存档 ↗</a></p>` : ''}
            ${art.html ? `<section class="neigong-section">${art.html}</section>` : ''}
            ${(art.sections || []).map((sec) => `
              <section class="neigong-section">
                <h2>${escapeHtml(sec.heading)}</h2>
                ${(sec.paragraphs || []).map((p) => `<p>${escapeHtml(p)}</p>`).join('')}
              </section>
            `).join('')}

            ${linkedSongs.length ? `
              <section class="linked-examples">
                <div style="font-size:13px; color:var(--accent-gold); font-weight:500; margin-bottom:12px;">✦ 本期呼应歌词实例（点击直达对应卡片）</div>
                <div style="display:flex; flex-direction:column; gap:10px;">
                  ${linkedSongs.map((s) => `
                    <button type="button" class="search-result-item" style="margin-top:0;" data-jump-issue="${escapeHtml(issue.date)}" data-jump-song="${escapeHtml(s.id)}">
                      <div style="display:flex; justify-content:space-between; gap:8px;">
                        <strong style="font-family:var(--font-serif); font-size:16px;">${escapeHtml(s.index)} · 《${escapeHtml(s.title)}》— ${escapeHtml(s.artist)}</strong>
                        <span class="pill pill-gold">${escapeHtml(s.technique)}</span>
                      </div>
                      <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">${escapeHtml(s.neigongMatch?.note || s.reason)}</div>
                    </button>
                  `).join('')}
                </div>
              </section>
            ` : ''}
          </article>
        `;

        document.getElementById('backNeigongListBtn').addEventListener('click', () => {
          appState.route = 'neigong';
          renderAll();
        });

        root.querySelectorAll('[data-jump-song]').forEach((b) => {
          b.addEventListener('click', () => {
            jumpToItem(b.getAttribute('data-jump-issue'), 'song-' + b.getAttribute('data-jump-song'));
          });
        });
      }

      function jumpToItem(date, domId) {
        appState.currentDate = date;
        appState.route = 'home';
        appState.filterLang = '全部';
        appState.filterEmotion = '全部';
        appState.filterTechnique = '全部';
        syncUrlDate(date);
        renderAll();
        setTimeout(() => {
          const el = document.getElementById(domId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('pulse-highlight');
            setTimeout(() => el.classList.remove('pulse-highlight'), 1800);
          }
        }, 60);
      }

      async function switchIssue(date) {
        if (!appState.issuesByDate[date] && ENABLE_REMOTE_DATA_FETCH) {
          try {
            const res = await fetch(`./data/issues/${encodeURIComponent(date)}.json`);
            if (res.ok) appState.issuesByDate[date] = await res.json();
          } catch {
            // 保留已有缓存
          }
        }
        if (appState.issuesByDate[date]) {
          appState.currentDate = date;
          appState.openDislikeMenuId = null;
          syncUrlDate(date);
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function openSearchModal() {
        const modal = document.getElementById('searchModal');
        const input = document.getElementById('searchInput');
        modal.classList.add('open');
        input.value = '';
        renderSearchResults('');
        setTimeout(() => input.focus(), 40);
      }

      function renderSearchResults(q) {
        const container = document.getElementById('searchResults');
        const term = q.trim().toLowerCase();
        const matches = [];

        appState.dates.forEach((date) => {
          const issue = appState.issuesByDate[date];
          if (!issue) return;

          (issue.songs || []).forEach((s) => {
            const hay = `${s.title} ${s.artist} ${s.lyricist || ''} ${s.emotion} ${s.technique} ${(s.lines || []).join(' ')}`.toLowerCase();
            if (!term || hay.includes(term)) {
              matches.push({
                kind: '歌词',
                date,
                title: `《${s.title}》— ${s.artist}`,
                meta: `${s.emotion} · ${s.technique}`,
                snippet: (s.lines || [])[0] || '',
                action: () => jumpToItem(date, 'song-' + s.id)
              });
            }
          });

          (issue.quotes || []).forEach((item) => {
            const hay = `${item.text} ${item.source} ${item.emotion} ${item.technique}`.toLowerCase();
            if (term && hay.includes(term)) {
              matches.push({
                kind: '金句',
                date,
                title: item.source,
                meta: `${item.emotion} · ${item.technique}`,
                snippet: item.text.slice(0, 64) + (item.text.length > 64 ? '…' : ''),
                action: () => jumpToItem(date, 'quote-' + item.id)
              });
            }
          });

          if (issue.neigong) {
            const art = issue.neigong;
            const hay = `${art.title} ${art.coreTechnique} ${art.excerpt}`.toLowerCase();
            if (!term || hay.includes(term)) {
              matches.push({
                kind: '内功',
                date,
                title: art.title,
                meta: art.coreTechnique,
                snippet: art.excerpt.slice(0, 64) + '…',
                action: () => {
                  appState.route = 'neigong-detail';
                  appState.neigongDate = date;
                  renderAll();
                }
              });
            }
          }
        });

        for (const art of ARCHIVED_ARTICLES) {
          if (term && `${art.title} ${art.excerpt} ${art.html.replace(/<[^>]*>/g,' ')}`.toLowerCase().includes(term)) matches.push({kind:'内功',date:art.date,title:art.title,meta:art.coreTechnique,snippet:art.excerpt.slice(0,64)+'…',action:()=>{appState.route='neigong-detail';appState.neigongDate=art.id;renderAll();window.scrollTo({top:0});}});
        }
        const top = matches.slice(0, 30);
        if (top.length === 0) {
          container.innerHTML = `<div style="padding:18px; text-align:center; color:var(--text-muted); font-size:13.5px;">未找到与“${escapeHtml(q)}”匹配的内容。</div>`;
          return;
        }

        container.innerHTML = top.map((m, i) => `
          <button type="button" class="search-result-item" data-sr-idx="${i}">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;">
              <strong style="font-family:var(--font-serif); font-size:15px;">${escapeHtml(m.title)}</strong>
              <span class="pill">${escapeHtml(m.kind)} · ${escapeHtml(m.date)}</span>
            </div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">${escapeHtml(m.meta)} · ${escapeHtml(m.snippet)}</div>
          </button>
        `).join('');

        container.querySelectorAll('[data-sr-idx]').forEach((b) => {
          b.addEventListener('click', () => {
            document.getElementById('searchModal').classList.remove('open');
            top[Number(b.getAttribute('data-sr-idx'))].action();
          });
        });
      }

      function openSyncModal() {
        document.getElementById('workerUrlInput').value = appState.sync.workerUrl || '';
        document.getElementById('workerTokenInput').value = appState.sync.token || '';
        document.getElementById('importJsonInput').value = '';
        document.getElementById('syncModal').classList.add('open');
      }

      function renderAll() {
        const url=new URL(location.href);
        if(appState.route==='neigong-detail') url.searchParams.set('article',appState.neigongDate);
        else if(appState.route==='neigong') url.searchParams.set('article','list');
        else url.searchParams.delete('article');
        try {history.replaceState({},'',url);} catch {}
        renderTopNav();
        if (appState.route === 'home') renderHome();
        else if (appState.route === 'likes') renderLikes();
        else if (appState.route === 'neigong') renderNeigongList();
        else if (appState.route === 'neigong-detail') renderNeigongDetail();
      }

      async function init() {
        // Load persisted state
        const savedUser = safeReadStorage(STORAGE_KEY, null);
        if (savedUser) {
          appState.user = {
            likedSongs: savedUser.likedSongs || {},
            likedQuotes: savedUser.likedQuotes || {},
            notes: Array.isArray(savedUser.notes) ? savedUser.notes : [],
            dislikes: Array.isArray(savedUser.dislikes) ? savedUser.dislikes : []
          };
        }
        const savedSync = safeReadStorage(SYNC_KEY, null);
        if (savedSync) appState.sync = savedSync;

        // Seed embedded issues
        SEED_ISSUES.forEach((issue) => {
          appState.issuesByDate[issue.date] = issue;
        });

        // In D1 production hosting, load live index.json & latest issue dynamically
        if (ENABLE_REMOTE_DATA_FETCH) {
          try {
            const idxRes = await fetch('./data/index.json', {cache:'no-store'});
            if (idxRes.ok) {
              const idxData = await idxRes.json();
              for (const meta of idxData.issues || []) {
                {
                  try {
                    const r = await fetch(`./data/issues/${encodeURIComponent(meta.date)}.json`);
                    if (r.ok) appState.issuesByDate[meta.date] = await r.json();
                  } catch {
                    // 跳过单期加载异常
                  }
                }
              }
            }
          } catch {
            // 本地离线打开时无缝回退至内置核验数据
          }
        }

        appState.dates = Object.keys(appState.issuesByDate).sort().reverse();
        const urlDate = new URLSearchParams(window.location.search).get('date');
        appState.currentDate = (urlDate && appState.issuesByDate[urlDate]) ? urlDate : appState.dates[0];

        const articleParam=new URLSearchParams(location.search).get('article');
        if(articleParam==='list') appState.route='neigong';
        else if(articleParam && (ARCHIVED_ARTICLES.some(a=>a.id===articleParam) || appState.issuesByDate[articleParam]?.neigong)) {appState.route='neigong-detail';appState.neigongDate=articleParam;}

        // Global UI bindings
        document.getElementById('brandHomeBtn').addEventListener('click', () => {
          appState.route = 'home';
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('closeSearchBtn').addEventListener('click', () => {
          document.getElementById('searchModal').classList.remove('open');
        });
        document.getElementById('searchInput').addEventListener('input', (e) => renderSearchResults(e.target.value));

        document.getElementById('closeNoteBtn').addEventListener('click', () => {
          document.getElementById('noteModal').classList.remove('open');
        });
        document.getElementById('saveNoteBtn').addEventListener('click', () => {
          if (!appState.pendingNote) return;
          appState.user.notes.unshift({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            ...appState.pendingNote,
            note: document.getElementById('noteTextInput').value.trim(),
            tag: document.getElementById('noteTagInput').value.trim(),
            createdAt: new Date().toISOString()
          });
          persistUserState(true);
          document.getElementById('noteModal').classList.remove('open');
          renderTopNav();
          showToast('已收入单句灵感本');
        });

        document.getElementById('closeSyncBtn').addEventListener('click', () => {
          document.getElementById('syncModal').classList.remove('open');
        });
        document.getElementById('saveSyncBtn').addEventListener('click', () => {
          const url = document.getElementById('workerUrlInput').value.trim();
          const token = document.getElementById('workerTokenInput').value.trim();
          if (url && !url.startsWith('https://')) {
            showToast('Worker 地址必须以 https:// 开头');
            return;
          }
          appState.sync = { workerUrl: url, token };
          safeWriteStorage(SYNC_KEY, appState.sync);
          if (url) syncToCloud(true);
          else showToast('已清除云端同步配置，仅使用本地存储');
        });
        document.getElementById('pullSyncBtn').addEventListener('click', pullFromCloud);

        document.getElementById('importJsonBtn').addEventListener('click', () => {
          const raw = document.getElementById('importJsonInput').value.trim();
          if (!raw) return;
          try {
            const parsed = JSON.parse(raw);
            if (!parsed.date || !Array.isArray(parsed.songs)) {
              showToast('JSON 格式缺少 date 或 songs 字段');
              return;
            }
            appState.issuesByDate[parsed.date] = parsed;
            appState.dates = Object.keys(appState.issuesByDate).sort().reverse();
            appState.currentDate = parsed.date;
            appState.route = 'home';
            document.getElementById('syncModal').classList.remove('open');
            renderAll();
            showToast(`已导入 ${parsed.date} 期次`);
          } catch (err) {
            showToast(`JSON 解析失败：${err.message}`);
          }
        });

        // Close popovers & modals on outside click / Escape
        document.addEventListener('click', () => {
          if (appState.openDislikeMenuId) {
            appState.openDislikeMenuId = null;
            if (appState.route === 'home') renderHome();
          }
        });
        ['searchModal', 'noteModal', 'syncModal'].forEach((id) => {
          const el = document.getElementById(id);
          el.addEventListener('click', (e) => {
            if (e.target === el) el.classList.remove('open');
          });
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            ['searchModal', 'noteModal', 'syncModal'].forEach((id) => document.getElementById(id).classList.remove('open'));
          }
          const tag = (document.activeElement && document.activeElement.tagName) || '';
          if ((e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
            e.preventDefault();
            openSearchModal();
          }
        });

        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
